<section class="section orange">
  <div class="icon">🔔</div>
  <div class="content">
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>
    <button type="button" (click)="toggle()">
      {{ visible ? 'Masquer' : 'Afficher' }} les notifications
    </button>

    @if (visible) {
      <ul>
        @for (n of notifications; track $index) {
          <li>{{ n }}</li>
        }
      </ul>
    }
  </div>
</section>
